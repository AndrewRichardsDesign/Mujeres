<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The March - Open Peeps Walking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #f5f0e8;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: flex-end;
        }

        /* Ground line */
        .ground {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #e8ddd0;
            border-top: 2px solid #c9b99a;
        }

        /* The marching container — holds two identical groups for seamless loop */
        .march-track {
            position: fixed;
            bottom: 60px;
            left: 0;
            display: flex;
            animation: march 12s linear infinite;
        }

        /* Each group of peeps (duplicated for seamless loop) */
        .peep-group {
            display: flex;
            align-items: flex-end;
            gap: 80px;
            padding-right: 80px;
            flex-shrink: 0;
        }

        .peep {
            height: 180px;
            width: auto;
            animation: bob 0.6s ease-in-out infinite alternate;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15));
        }

        /* Stagger the bobbing so they don't all bounce in sync */
        .peep:nth-child(1) { animation-delay: 0s; }
        .peep:nth-child(2) { animation-delay: 0.15s; }
        .peep:nth-child(3) { animation-delay: 0.3s; }
        .peep:nth-child(4) { animation-delay: 0.45s; }

        /* March from right to left — move exactly one group width */
        @keyframes march {
            from { transform: translateX(100vw); }
            to   { transform: translateX(calc(100vw - var(--group-width))); }
        }

        /* Subtle walking bob */
        @keyframes bob {
            from { transform: translateY(0); }
            to   { transform: translateY(-6px); }
        }

        /* Title overlay */
        .title {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Georgia', serif;
            font-size: 28px;
            color: #3a3a3a;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="title">The March</div>

    <div class="march-track" id="marchTrack">
        <!-- Group 1 -->
        <div class="peep-group">
            <img class="peep" src="5e5362e2f5fa1aefa7ffe47c_peep-standing-22.svg" alt="Peep 1">
            <img class="peep" src="5e5363188becbffe8c57172c_peep-standing-24.svg" alt="Peep 2">
            <img class="peep" src="5e53633a7371bbe22da4c986_peep-standing-25.svg" alt="Peep 3">
            <img class="peep" src="5e5365e367293a5eb7630824_peep-standing-26.svg" alt="Peep 4">
        </div>
        <!-- Group 2 (duplicate for seamless loop) -->
        <div class="peep-group">
            <img class="peep" src="5e5362e2f5fa1aefa7ffe47c_peep-standing-22.svg" alt="Peep 1">
            <img class="peep" src="5e5363188becbffe8c57172c_peep-standing-24.svg" alt="Peep 2">
            <img class="peep" src="5e53633a7371bbe22da4c986_peep-standing-25.svg" alt="Peep 3">
            <img class="peep" src="5e5365e367293a5eb7630824_peep-standing-26.svg" alt="Peep 4">
        </div>
    </div>

    <div class="ground"></div>

    <script>
        // Measure one peep-group's width and set the CSS variable for seamless looping
        function setGroupWidth() {
            const group = document.querySelector('.peep-group');
            if (group) {
                const width = group.offsetWidth;
                document.getElementById('marchTrack').style.setProperty('--group-width', width + 'px');
            }
        }
        // Wait for images to load so dimensions are correct
        window.addEventListener('load', setGroupWidth);
        window.addEventListener('resize', setGroupWidth);
    </script>
</body>
</html>
